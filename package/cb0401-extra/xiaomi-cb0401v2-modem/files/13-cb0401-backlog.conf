# Xiaomi CB0401 / CB0401V2: the modem's QMAP link steers its packets to the
# other CPU through RPS, and that CPU sees short bursts of other work about
# every 44 s, during which its receive backlog fills. With the 4096 of
# 12-nss-networking.conf a 4-minute 260-420 Mbit/s download over Wi-Fi lost
# 13598 packets in two such bursts; with 16384 a 360-510 Mbit/s one lost none
# (2026-11-06). The backlog is a limit, not preallocated memory.
net.core.netdev_max_backlog=16384
